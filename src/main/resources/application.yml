spring:
  application:
    name: prom-marketplace
  datasource:
    url: jdbc:h2:mem:marketplace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: false

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: Europe/Kyiv
  payment:
    fee-percent: 3.50
  ads:
    min-daily-budget: 50.00
    default-slots: 3
    max-slots: 10

logging:
  level:
    root: INFO
    ua.marketplace: INFO
