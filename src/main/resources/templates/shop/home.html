<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Головна', ~{::main})}">
<body>
<main id="main" class="container">
  <section class="hero">
    <h1>Ринок</h1>
    <p class="lead">Навчальний маркетплейс: товари продавців, реклама з оплатою за клік і тестова онлайн-оплата.</p>
  </section>

  <section aria-labelledby="cat-heading">
    <h2 id="cat-heading">Категорії</h2>
    <ul class="chips">
      <li th:each="c : ${categories}">
        <a class="chip" th:href="@{/catalog(category=${c.id})}" th:text="${c.name}">Категорія</a>
      </li>
    </ul>
  </section>

  <section aria-labelledby="ads-heading" th:if="${not #lists.isEmpty(ads)}">
    <h2 id="ads-heading">Рекомендовані</h2>
    <div class="grid-cards">
      <th:block th:each="a : ${ads}">
        <div th:replace="~{fragments/product-card :: ad(${a})}"></div>
      </th:block>
    </div>
  </section>

  <section aria-labelledby="new-heading">
    <h2 id="new-heading">Нові товари</h2>
    <div class="grid-cards" th:if="${not #lists.isEmpty(newProducts)}">
      <th:block th:each="p : ${newProducts}">
        <div th:replace="~{fragments/product-card :: card(${p}, ${categoryNames[p.categoryId]})}"></div>
      </th:block>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(newProducts)}">
      <p>Поки що товарів немає.</p>
      <p><a class="btn btn-primary" th:href="@{/cabinet}">Стати продавцем і додати товар</a></p>
    </div>
  </section>
</main>
</body>
</html>
